global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:8002']
  - job_name: publisher
    static_configs:
      - targets: ['publisher:8002']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
