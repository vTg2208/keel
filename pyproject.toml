[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payops"
version = "0.1.0"
description = "Local payment reliability and DevOps lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pika>=1.3,<2", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "PyYAML>=6,<7", "locust>=2.33,<3"]

[tool.setuptools.packages.find]
include = ["payops*"]

[tool.setuptools.package-data]
payops = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running PostgreSQL and RabbitMQ"]

[tool.ruff]
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
